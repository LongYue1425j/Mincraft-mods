<style>
body{
text-align: center;
background-color: rgb(235, 222, 197);
align-items: center;
justify-content: center;
}
.box{
margin-top: 12rem;
font-size: 25px;
background-color: rgb(0, 0, 0);
color: snow;
height: 350px;
width: 350px;
border-radius: 16px;
margin-left: 45rem;
}
button{
background: linear-gradient(135deg,#00d9ff,#ff00ea);
border: none;
height: 40px;
font-size: 23px;
border-radius: 20px;
cursor: pointer;
position: relative;
}
button:hover::before{
    width: 130px;
    height: 40px;
}
button::before{
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: 0.6s ease;
}

</style>

<script>

    document.getElementById('return').addEventListener('click',event=>{
